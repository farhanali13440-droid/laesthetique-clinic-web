name: Add original Google reviews to Dr Mehwish landing page
on:
  push:
    paths:
      - '.github/workflows/add-google-reviews.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Google reviews section
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/routes/dr-mehwish-zaman.tsx')
          s = p.read_text()
          pattern = r'<section className="bg-white px-4 py-14 sm:px-6 sm:py-18"><SectionTitle eyebrow="Patient feedback".*?</section>\n\n      <section className="bg-\[#f7f9fc\] px-4 py-14 sm:px-6 sm:py-18"><SectionTitle eyebrow="Dental services"'
          replacement = '''<section className="bg-white px-4 py-14 sm:px-6 sm:py-18">
            <SectionTitle eyebrow="Google reviews" title="What patients are saying" copy="These are original reviews from La Esthetique's Google Business Profile." />
            <div className="mx-auto mt-9 grid max-w-6xl gap-4 md:grid-cols-2">
              {[
                ["Abdullah Aziz Khan", "Had a great experience at La Esthetique with Dr. Mehwish. I recently got my scaling and polishing done, and the whole procedure was smooth, comfortable, and professionally handled. Dr. Mehwish was very gentle, attentive, and made sure I felt at ease throughout. My teeth feel so clean and fresh now. Really impressed with the care and service — highly recommended!"],
                ["Usman Ak", "Doctors are professional and staff is very friendly 😊"],
                ["Imran Khan", "Environment is very good and the staff is very good clinic is very clean doctor are professional 👌 I am very satisfied"],
                ["Usman Akram", "LA ESTHETIQUE provides an amazing experience from start to finish. The staff is highly professional, friendly, and very knowledgeable. The environment is clean, relaxing, and well-maintained. I’m really satisfied with the service quality and results. They truly focus on customer care and comfort."],
              ].map(([name, review], i) => <Reveal key={name} delay={i * 50} className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
                <div className="flex items-center justify-between gap-3">
                  <div><p className="font-semibold text-[#083577]">{name}</p><p className="mt-1 text-[10px] text-slate-500">Google Review</p></div>
                  <div className="text-sm tracking-[0.08em] text-[#f4b400]" aria-label="5 star review">★★★★★</div>
                </div>
                <p className="mt-4 text-sm leading-relaxed text-slate-600">“{review}”</p>
              </Reveal>)}
            </div>
            <div className="mt-7 text-center"><a href="https://share.google/g9VBJ3SeSl1GbsNax" target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 rounded-sm bg-[#0b357f] px-5 py-3 text-xs font-semibold text-white hover:bg-espresso">View all Google reviews <ArrowRight className="h-3.5 w-3.5" /></a></div>
          </section>

      <section className="bg-[#f7f9fc] px-4 py-14 sm:px-6 sm:py-18"><SectionTitle eyebrow="Dental services"'''
          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one review section, replaced {n}')
          p.write_text(ns)
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/dr-mehwish-zaman.tsx
          git rm .github/workflows/add-google-reviews.yml
          git commit -m "Add original Google reviews to Dr Mehwish landing page"
          git push
